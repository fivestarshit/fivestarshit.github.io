<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fivestarshit 的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        
        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .links a {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .content {
            margin-top: 40px;
            text-align: left;
            color: #555;
            line-height: 1.8;
        }
        
        .content h2 {
            color: #333;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        .content p {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 欢迎</h1>
        <p class="subtitle">这是 fivestarshit 的个人主页</p>
        
        <div class="links">
            <a href="https://github.com/fivestarshit" target="_blank">GitHub</a>
            <a href="mailto:your-email@example.com">邮箱联系</a>
        </div>
        
        <div class="content">
            <h2>关于我</h2>
            <p>
                欢迎来到我的个人主页！这个页面使用 GitHub Pages 部署，
                是一个简洁而优雅的个人站点。
            </p>
            
            <h2>特性</h2>
            <ul style="margin-left: 20px;">
                <li>✨ 响应式设计，在各种设备上完美显示</li>
                <li>🚀 快速加载，极致体验</li>
                <li>💫 现代化的界面设计</li>
                <li>🔧 易于自定义和扩展</li>
            </ul>
            
            <h2>开始使用</h2>
            <p>
                你可以修改这个 HTML 文件来自定义你的个人主页内容。
                所有更改将自动通过 GitHub Pages 部署。
            </p>
        </div>
    </div>
</body>
</html>
